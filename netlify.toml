# Netlify + Next.js. Do not set `publish` here — @netlify/plugin-nextjs
# owns the output directory. Site UI / auto-detected plugin stays in charge.

[build]
  # Exit 0 = skip this deploy (saves production credits). Exit 1 = build.
  # Skip when the commit only touches docs, probes, or scratch output.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!*.md' ':!*.txt' ':!scripts' ':!repro-*'"

[build.environment]
  # Kill public.books REST until PostgREST 57014s recover. Set false to resume.
  DISABLE_BOOKS_REST = "true"
